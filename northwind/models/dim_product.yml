version: 2

models:
  - name: dim_product
    description: Product dimension. One row per product.
    columns:
      - name: productkey
        description: Dimension key
        data_tests:
          - unique
          - not_null
      - name: productid
        description: Primary key of the source system (business key)
        data_tests:
          - unique
          - not_null
      - name: productname
        description: The name of the product
      - name: supplierkey
        description: FK to dim_supplier (snowflake)
      - name: categoryname
        description: Product category name
        data_tests:
          - not_null
      - name: categorydescription
        description: Product category description
        data_tests:
          - not_null